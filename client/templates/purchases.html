<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Compras - Cliente ASMA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
        }
        .nav {
            display: flex;
            gap: 20px;
        }
        .nav a {
            color: #667eea;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 1.1em;
        }
        .nav a:hover, .nav a.active {
            background: #667eea;
            color: white;
        }
        .user-info {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .info-card {
            padding: 15px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }
        .content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .page-title {
            font-size: 2.2em;
            color: #667eea;
            margin-bottom: 10px;
        }
        .page-subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }
        .section-title {
            font-size: 1.8em;
            color: #667eea;
            margin: 30px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        .purchases-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .purchase-card {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 25px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .purchase-card:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }
        .purchase-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }
        .purchase-item-name {
            font-size: 1.6em;
            font-weight: bold;
            color: #333;
        }
        .purchase-price {
            font-size: 1.8em;
            color: #28a745;
            font-weight: bold;
        }
        .purchase-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }
        .detail-item {
            font-size: 0.95em;
            color: #666;
        }
        .detail-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 15px;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-delivered {
            background: #d4edda;
            color: #155724;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }
        .empty-state-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }
        .empty-state-title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .empty-state-text {
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        .goto-home-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 1.1em;
        }
        .goto-home-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Cliente ASMA</h1>
            <nav class="nav">
                <a href="/">Home</a>
                <a href="/purchases" class="active">Minhas Compras</a>
            </nav>
        </div>

        <div class="user-info">
            <div class="info-card">
                <div class="info-label">💰 Saldo Disponível</div>
                <div class="info-value">{{ budget }} USD</div>
            </div>
            <div class="info-card">
                <div class="info-label">📍 Localização</div>
                <div class="info-value" style="font-size: 0.9em;">{{ location }}</div>
            </div>
            <div class="info-card">
                <div class="info-label">👤 Cliente ID</div>
                <div class="info-value" style="font-size: 1em; font-family: monospace;">{{ client_id }}</div>
            </div>
        </div>

        <div class="content">
            <h1 class="page-title">🛍️ Minhas Compras</h1>
            <p class="page-subtitle">Histórico completo de todas as suas compras e pedidos</p>

            <div id="purchases-content">
                <!-- Content will be inserted here -->
            </div>
        </div>
    </div>
</body>
</html>
