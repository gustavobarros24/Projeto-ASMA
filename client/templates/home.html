<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente ASMA - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
        }
        .nav {
            display: flex;
            gap: 20px;
        }
        .nav a {
            color: #667eea;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 1.1em;
        }
        .nav a:hover, .nav a.active {
            background: #667eea;
            color: white;
        }
        .user-info {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .info-card {
            padding: 15px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }
        .content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .page-title {
            font-size: 2.2em;
            color: #667eea;
            margin-bottom: 10px;
        }
        .page-subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            margin-bottom: 30px;
            transition: all 0.3s;
            font-weight: 600;
        }
        .refresh-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .companies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }
        .company-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
        }
        .company-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .company-name {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .company-url {
            font-size: 0.95em;
            opacity: 0.9;
            margin-bottom: 15px;
            word-break: break-all;
        }
        .company-id {
            font-size: 0.85em;
            opacity: 0.7;
            font-family: 'Courier New', monospace;
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Cliente ASMA</h1>
            <nav class="nav">
                <a href="/" class="active">Home</a>
                <a href="/purchases">Minhas Compras</a>
            </nav>
        </div>

        <div class="user-info">
            <div class="info-card">
                <div class="info-label">💰 Saldo Disponível</div>
                <div class="info-value">{{ budget }} USD</div>
            </div>
            <div class="info-card">
                <div class="info-label">📍 Localização</div>
                <div class="info-value" style="font-size: 0.9em;">{{ location }}</div>
            </div>
            <div class="info-card">
                <div class="info-label">👤 Cliente ID</div>
                <div class="info-value" style="font-size: 1em; font-family: monospace;">{{ client_id }}</div>
            </div>
        </div>

        <div class="content">
            <h1 class="page-title">🏢 Empresas Disponíveis</h1>
            <p class="page-subtitle">Escolha uma empresa para explorar os produtos disponíveis</p>

            <button class="refresh-btn" onclick="location.reload()">🔄 Atualizar Lista</button>

            <div class="companies-grid">
                <!-- Companies will be inserted here -->
            </div>
        </div>
    </div>
</body>
</html>
